# Perfils del radar. El radar és de Stimulo: la puntuació, el tauler i els avisos per correu
# es fan només per als perfils amb `actiu: true` (per defecte, només Stimulo).
#
# Servei a clients: si un client (p. ex. DOGA) contracta el radar, n'hi ha prou amb posar el seu
# perfil a `actiu: true` per puntuar-lo i generar-ne els enviaments per zona.
#
# - tipus: agencia | empresa | client
# - zona: codi de data/zones.yaml (on està establerta l'entitat)
# - beneficiari_com: tipus d'entitat que és davant d'una convocatòria
#     (pime, gran_empresa, startup, universitat, centre_recerca, centre_tecnologic, hospital,
#      entitat_sense_anim_lucre, cluster_aei)
# - rols: com pot participar (beneficiari, soci, proveidor_extern, subcontractat, assessor)
# - focus: interessos temàtics ponderats 1-3 (vocabulari a radar/dades.py > FOCUS)
# - paraules_clau: termes que els vigilants automàtics busquen a BDNS, F&T, TED i PLACSP
#
# Els socis potencials per a cada ajut no surten d'aquí sinó dels contactes de Holded
# (radar/socis.py), que mai es desen al repositori.

perfils:
  stimulo:
    nom: Stimulo
    tipus: agencia
    actiu: true
    zona: ES-CT-B
    descripcio: >
      Agència de disseny i desenvolupament de producte (Stimulo Design SL, des del 2003). Disseny
      industrial, enginyeria i industrialització de productes amb tecnologies profundes: medtech,
      fotònica, quàntica, robòtica, mobilitat, agrotech, ús dual. Experiència en projectes AEI via
      secpho (Q LEAF, SEPTIBELL, DRONSTORE II).
    beneficiari_com: [pime]
    rols: [beneficiari, soci, proveidor_extern, subcontractat]
    trl: [2, 8]
    focus:
      deep_tech: 3
      prova_concepte: 3
      transferencia: 3
      disseny: 3
      dual: 3
      sostenibilitat: 3
      dispositius_medics: 2
      salut: 2
      mobilitat: 2
      robotica: 2
      agrotech: 2
      fotonica: 2
      economia_circular: 2
      cooperacio: 2
      industria: 2
      defensa: 2
      espai: 2
      talent: 2
      ia: 1
      digital: 1
    paraules_clau:
      - prueba de concepto
      - prova de concepte
      - proof of concept
      - prototipo
      - prototip
      - diseño industrial
      - disseny industrial
      - industrial design
      - ecodiseño
      - ecodisseny
      - deep tech
      - tecnologías disruptivas
      - doble uso
      - dual use
      - industria de defensa
      - sector de la defensa
      - tecnologías de defensa
      - defence
      - seguridad y defensa
      - antidrón
      - counter-drone
      - aeroespacial
      - aerospace
      - transferencia de conocimiento
      - transferència de coneixement
      - valorización
      - robótica
      - robotics
      - drones
      - agrotech
      - fotónica
      - photonics
      - producto sanitario
      - medical device
      - economía circular


  # --- Clients de servei (inactius fins que contractin el radar) ------------------------------
  doga:
    nom: DOGA
    tipus: client
    actiu: false
    zona: ES-CT-B
    contacte: Responsable de nous productes
    descripcio: >
      DOGA SA (Abrera, Baix Llobregat). Motors i motorreductors DC i brushless (sèrie BRL100,
      24 V, CANopen), sistemes de neteja de parabrisa, elevavidres. Vehicle industrial, bus,
      ferrocarril, maquinària agrícola i d'obra, nàutica. GRAN EMPRESA (378 treballadors a la SA,
      grup >1.000; propietat de Nazca Capital): intensitats de gran empresa, +15 punts si coopera
      amb pimes. Va obtenir PERTE VEC II (2023).
    beneficiari_com: [gran_empresa]
    rols: [beneficiari, soci]
    trl: [4, 9]
    focus:
      automocio: 3
      mobilitat: 3
      industria: 3
      prova_concepte: 2
      robotica: 2
      agrotech: 2
      sostenibilitat: 2
      economia_circular: 2
      cooperacio: 2
      energia: 1
      dual: 1
      digital: 1
    paraules_clau:
      - motor eléctrico
      - electric motor
      - motorreductor
      - brushless
      - actuador
      - actuator
      - vehículo industrial
      - automoción
      - movilidad eléctrica

config:
  # Pesos de la puntuació (0-100). Vegeu radar/puntuacio.py
  pesos: {tematica: 40, rol: 20, zona: 15, trl: 10, impacte: 15}
  # Dies d'antelació de cada senyal d'alerta. Vegeu radar/calendari.py
  alertes: {preparar: 60, vigilar: 14, tancament: 21, tall: 45}
  # Avís per correu de línies noves amb potencial (python -m radar avisa)
  avisos:
    prioritats: [A]          # prioritats que sempre s'avisen
    prioritat_b_dies: 45     # les B s'avisen si obren o tanquen en aquest nombre de dies
    antelacio_dies: 60       # una línia propera s'avisa quan falten aquests dies per obrir
    maxim_linies: 8          # línies amb fitxa completa per correu (la resta, en taula resum)
    maxim_socis: 3           # socis suggerits per línia
    remitent_nom: Radar d'ajuts Stimulo
    signatura: "Xavi\nStimulo · stimulo.com"
  # Licitacions (python -m radar licitacions; aplicació > Licitacions). Vegeu docs/licitacions.md
  licitacions:
    # CPV: 8 xifres = codi exacte; menys = família. Calibrat amb les primeres revisions reals (oct. 2026):
    # els codis genèrics d'enginyeria (713…), d'assaigs (716…) i de consultoria d'R+D (732…) portaven
    # direccions d'obra, PRL i estudis sense relació amb Stimulo.
    cpv_principals:
      - "7132"      # serveis de disseny d'enginyeria
      - "79930000"  # serveis de disseny especialitzat
      - "79933000"  # serveis de suport al disseny
      - "79934000"  # disseny de mobiliari
      - "733"       # disseny i execució d'R+D
      - "7342"      # estudis de previabilitat i demostració tecnològica
    cpv:            # sumen menys: cal una paraula clau per arribar a verd
      - "7312"      # desenvolupament experimental
      - "734"       # R+D en seguretat i defensa
      - "73100000"  # serveis d'R+D (codi genèric exacte)
    paraules_clau:
      - disseny industrial
      - diseño industrial
      - disseny de producte
      - diseño de producto
      - desenvolupament de producte
      - desarrollo de producto
      - prototip
      - prototipo
      - prototipado
      - prova de concepte
      - prueba de concepto
      - ecodisseny
      - ecodiseño
      - enginyeria de producte
      - ingeniería de producto
      - compra pública innovadora
      - compra pública precomercial
      - dispositiu mèdic
      - producto sanitario
      - mobiliari urbà
      - mobiliario urbano
      - senyalètica
      - señalética
      - dron
      - robòtica
      - robótica
    # Paraules del títol que descarten un anunci encara que el CPV encaixi
    exclou: [obres, obras, direcció d'obra, dirección de obra, projecte constructiu, proyecto constructivo,
             redacció del projecte, redacción de proyecto, manteniment, mantenimiento, neteja, limpieza,
             vigilància, vigilancia y seguridad, prevenció de riscos, prevención de riesgos, assegurances, seguros,
             arqueològica, arqueológica, topogràfic, topográfico, urbanisme, urbanismo, auditoria, auditoría]
    import_min: 15000        # per sota, l'esforç d'oferta rarament compensa
    import_max: 750000       # per sobre, cal solvència alta o UTE
    dies_minims: 10          # menys dies que aquests: termini just
    xifra_negoci_anual: null # posa-hi la xifra de negoci de Stimulo per avisar de la solvència econòmica
    pscp_dataset: ybgg-dgi6  # dades obertes de la PSCP (analisi.transparenciacatalunya.cat)
    placsp_agregades_url: "" # canal ATOM d'agregació de la PLACSP (inclou plataformes autonòmiques); per validar
    dies_cerca: 7
  vigilancia:
    paisos_ted: [ESP]
    # CPV de serveis on Stimulo pot licitar (disseny, R+D, enginyeria, assajos)
    cpv:
      - "73000000"  # serveis d'R+D i consultoria relacionada
      - "73100000"  # serveis de recerca i desenvolupament experimental
      - "73200000"  # consultoria en R+D
      - "73300000"  # disseny i execució d'R+D
      - "73400000"  # R+D de seguretat i defensa
      - "73420000"  # estudi de previabilitat i demostració tecnològica
      - "71320000"  # serveis de disseny tècnic
      - "71300000"  # serveis d'enginyeria
      - "71600000"  # serveis d'assaig, anàlisi i consultoria tècnica
      - "79930000"  # serveis de disseny especialitzat
      - "79933000"  # serveis de suport al disseny
