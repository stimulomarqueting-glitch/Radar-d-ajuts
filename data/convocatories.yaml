# CATALUNYA
# =============================================================================================

- id: accio-exploracio-tecnologica
  nom: "Projectes d'exploració tecnològica (línia R+D+i 2026)"
  entitat: ACCIÓ
  nivell: catalunya
  origen: public
  instrument: subvencio
  fons: Generalitat (Estratègia d'innovació empresarial de Catalunya 2026-2030)
  zones: [ES-CT]
  ambit_geografic: Empreses amb establiment operatiu a Catalunya, sense restricció sectorial.
  beneficiaris: [pime, gran_empresa, startup]
  rols_stimulo: [proveidor_extern, beneficiari]
  focus: [prova_concepte, deep_tech, industria, sostenibilitat, digital, ia]
  intensitat_max: 75
  import_max_eur: 30000
  pressupost_min_eur: 20000
  pressupost_total_eur: 4900000
  durada_max_mesos: 10
  trl: [3, 6]
  modalitat: individual amb agent tecnològic extern obligatori
  ajuda_text: "75% de la despesa, màxim 30.000 € (projecte ~40.000 €); pressupost mínim 20.000 €; 10 mesos; bestreta 60%; auditoria al 100% fins 1.500 €."
  descripcio: >
    Validar una tecnologia amb evidències objectives abans d'una inversió més gran: prova de
    concepte, prototip o MVP, validació amb usuaris, proves experimentals, entrenament d'algorismes.
    Obligatori col·laborar amb un agent tecnològic extern (startup, centre tecnològic o proveïdor
    especialitzat). Despeses: personal propi, col·laboracions externes, materials de prototipatge.
  notes: >
    Règim de minimis (màx. 300.000 € per empresa en 3 exercicis). Línia NOVA del primer paquet de
    l'Estratègia 2026-2030 (16,9 M€). Bases: Resolució EMT/2403/2026 (DOGC 9708, 15/07/2026);
    convocatòria: Resolució EMT/2669/2026 (DOGC 9718, 29/07/2026). Tancament 21/09/2026 a les 14 h.
    Les bases són generals per a la línia R+D+i: una edició 2027 no requeriria bases noves (no verificat).
    Cal confirmar a les bases si una agència de disseny/enginyeria compta com a "proveïdor
    especialitzat" (molt plausible; no hi ha registre d'acreditació obligatori detectat).
  url: https://www.accio.gencat.cat/ca/serveis/cercador-ajuts-empresa/ajutsiserveis/26043-projectes-exploracio-tecnologica
  fonts_verificacio:
    - https://cecot.org/actualitat/emprenedoria-creixement-empresarial/enllac-seo-ajuts-accio-2026-projectes-exploracio-tecnologica/
    - https://cido.diba.cat/subvencions/21935051/subvencions-per-a-projectes-dinnovacio-empresarial-rdi-any-2026-linia-de-projectes-dexploracio-tecnologica-generalitat-de-catalunya-agencia-per-a-la-competitivitat-de-lempresa-accio
    - https://govern.cat/salapremsa/notes-premsa/858792/govern-activa-primers-17-milions-deuros-dajuts-inclosos-lestrategia-dinnovacio-empresarial-catalunya-2026-2030
  confianca: alta
  encaix_stimulo: 'Stimulo és l''«agent tecnològic extern» que la convocatòria fa obligatori: prototip, MVP i validació per a un client industrial català.'
  punts_forts:
    - 75 % de subvenció i bestreta del 60 %.
    - Admet grans empreses (règim de minimis).
    - 'Projecte petit (~40.000 €) i ràpid (10 mesos): bona porta d''entrada amb clients industrials.'
  socis_cal: [empresa, startup]
  calendari:
    recurrencia: anual
    estat: tancada
    obertura: 2026-07-29
    tancament: 2026-09-21
    finestra_habitual: "Estiu: publicació a finals de juliol, tancament a finals de setembre"
    verificat: 2026-10-06
    revisar: 2027-03-01
    revisar_motiu: "Exploració tecnològica: comprovar si ACCIÓ anuncia l'edició 2027 (pla d'ajuts anual / sessions informatives)"

