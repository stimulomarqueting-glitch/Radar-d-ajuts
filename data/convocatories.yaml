# Catàleg curat del Radar d'ajuts de Stimulo.
#
# Origen: "2025 Recull ajuts públics.xlsx" (data/origen/, camp excel_fila) + recerca d'octubre 2026.
# Estat a 06/10/2026. Les dades marcades "(no verificat)" a les notes s'han de confirmar a la font
# oficial abans de prendre decisions; `confianca` resumeix la solidesa de la fitxa:
#   alta    = dades de font oficial o de diverses fonts coincidents
#   mitjana = una font secundària fiable
#   baixa   = estimació o dada pendent de verificar
#
# Camps (vegeu radar/dades.py):
#   nivell: local | catalunya | estat | europa | internacional
#   origen: public | privat | universitat | fundacio_publica | fundacio_privada | corporatiu | mixt
#   instrument: subvencio | prestec | prestec_parcialment_reemborsable | cupo | premi | capital |
#               acceleracio | licitacio | compra_publica_innovacio | beca_contracte | mixt
#   zones: on ha d'estar establert el BENEFICIARI (data/zones.yaml)
#   beneficiaris: pime | gran_empresa | startup | universitat | centre_recerca | centre_tecnologic |
#                 hospital | entitat_sense_anim_lucre | cluster_aei | consorci | administracio
#   rols_stimulo: com hi pot entrar una agència com Stimulo (beneficiari, soci, proveidor_extern,
#                 subcontractat, assessor)
#   calendari.recurrencia: anual | multiples_talls | continua | puntual | desconeguda
#   calendari.obertura / tancament: última edició coneguda (o la vigent). Si ja ha passat i és
#     anual, el radar n'estima la propera edició (+1 any) i genera les alertes.

convocatories:

