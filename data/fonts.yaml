# Fonts que alimenten el radar.
# metode: api (vigilant automàtic a radar/vigilancia.py) | rss | web (revisió manual o scraping futur)
#         | butlleti (subscripció per correu) | manual
# frequencia: diaria | setmanal | mensual | per_convocatoria
# vigilant: nom del vigilant automàtic (bdns, sedia, ted, placsp) si n'hi ha

fonts:
  # --- Transversals (automàtiques) -----------------------------------------------------------
  - id: bdns
    nom: BDNS / InfoSubvenciones (Base de Datos Nacional de Subvenciones)
    nivell: transversal
    url: https://www.infosubvenciones.es/bdnstrans/GE/es/convocatorias
    metode: api
    frequencia: setmanal
    vigilant: bdns
    cobreix: Totes les convocatòries públiques d'Espanya (estat, CCAA incl. Generalitat, ens locals)
    notes: "API JSON pública: /bdnstrans/api/convocatorias/busqueda (documentació Swagger a /bdnstrans/doc/swagger)."

  - id: sedia
    nom: Funding & Tenders Portal (Comissió Europea) – API de cerca SEDIA
    nivell: europa
    url: https://ec.europa.eu/info/funding-tenders/opportunities/portal/
    metode: api
    frequencia: setmanal
    vigilant: sedia
    cobreix: Horizon Europe (EIC, clústers), Digital Europe, LIFE, EDF, cascada (FSTP)
    notes: "Estats 31094501 (oberta) i 31094502 (propera); tipus 1/2 subvencions, 8 cascada."

  - id: ted
    nom: TED – Tenders Electronic Daily (licitacions UE)
    nivell: europa
    url: https://ted.europa.eu/
    metode: api
    frequencia: setmanal
    vigilant: ted
    cobreix: Licitacions sobre llindar UE filtrades per CPV i país

  - id: placsp
    nom: Plataforma de Contratación del Sector Público (sindicació ATOM)
    nivell: estat
    url: https://contrataciondelestado.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3.atom
    metode: api
    frequencia: setmanal
    vigilant: placsp
    cobreix: Licitacions espanyoles (CPV de disseny, R+D, enginyeria i assajos)
    notes: "Fitxers de 500 entrades amb enllaç rel=next. Agregades (incl. plataforma catalana): sindicacion_1044/PlataformasAgregadasSinMenores.atom."

  - id: boe-sumari
    nom: BOE – sumari diari (API de dades obertes)
    nivell: estat
    url: https://www.boe.es/datosabiertos/api/boe/sumario/
    metode: api
    frequencia: diaria
    cobreix: Extractes de convocatòries (secció V-B) i bases (BOE-A)
    notes: "GET /datosabiertos/api/boe/sumario/AAAAMMDD amb Accept: application/json. Pendent d'automatitzar."

