name: Radar d'ajuts

on:
  schedule:
    - cron: "17 5 * * *"  # cada matí a les 05:17 UTC (06:17 o 07:17 a Barcelona)
  workflow_dispatch:
    inputs:
      tot:
        description: "Envia per correu totes les línies amb potencial (també les ja avisades)"
        type: boolean
        default: false
  push:
    paths:
      - "data/**"
      - "!data/estat/**"
      - "radar/**"

permissions:
  contents: write
  issues: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    # Amb la variable RADAR_PROGRAMADOR=vps, la revisió diària la fa el VPS: aquí no es programa
    if: github.event_name != 'schedule' || vars.RADAR_PROGRAMADOR != 'vps'
    runs-on: ubuntu-latest
    env:
      # Correu (vegeu README > Avís per correu). Sense aquests secrets, l'avís no s'envia.
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      RADAR_DESTINATARI: ${{ secrets.RADAR_DESTINATARI }}
      # Holded (només lectura) i classificació privada de socis: mai es desen al repositori
      HOLDED_API_KEY: ${{ secrets.HOLDED_API_KEY }}
      RADAR_SOCIS_YAML: ${{ secrets.RADAR_SOCIS_YAML }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependències
        run: pip install -r requirements.txt

      - name: Tests i validació del catàleg
        run: |
          python -m unittest discover -s tests
          python -m radar valida

      - name: Vigilància de fonts (BDNS, Funding & Tenders, TED, PLACSP)
        if: github.event_name != 'push'
        run: python -m radar vigila

      - name: Licitacions (PSCP, PLACSP i TED)
        if: github.event_name != 'push'
        continue-on-error: true
        run: python -m radar licitacions

      - name: Informe, tauler i calendari d'alertes
        run: python -m radar informe

      - name: Avís per correu de línies noves amb potencial
        if: github.event_name != 'push'
        continue-on-error: true
        run: python -m radar avisa --envia --novetats sortida/novetats.json --licitacions sortida/licitacions-noves.json ${{ inputs.tot && '--tot --maxim 12' || '' }}

      - name: Desa les sortides (sense dades de contactes)
        run: |
          git config user.name "radar-ajuts[bot]"
          git config user.email "radar-ajuts@users.noreply.github.com"
          git add sortida data/estat
          if git diff --cached --quiet; then
            echo "Sense canvis"
          else
            git commit -m "Radar: actualització $(date +%F)"
            git push
          fi

      - name: Avís a GitHub (només si el correu no està configurat; els dilluns)
        if: github.event_name != 'push' && env.SMTP_HOST == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date +%u)" != "1" ]; then exit 0; fi
          {
            echo "## Alertes dels propers 14 dies"
            echo
            echo '```'
            python -m radar alertes --dies 14
            echo '```'
            echo
            if [ -f sortida/novetats.md ]; then cat sortida/novetats.md; fi
            echo
            echo "Configura els secrets SMTP_* i RADAR_DESTINATARI per rebre l'avís complet per correu (amb socis de Holded)."
          } > avis.md
          gh label create radar --color 2A3DBA --description "Radar d'ajuts" 2>/dev/null || true
          gh issue create --title "Radar d'ajuts — $(date +%d/%m/%Y)" --body-file avis.md --label radar
